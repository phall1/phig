name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Documentation tests
        run: cargo test --doc --all-features --locked
      - name: Shell lint
        run: shellcheck install.sh scripts/*.sh
      - name: Dependency policy
        run: |
          mkdir -p "$RUNNER_TEMP/cargo-deny"
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz |
            tar -C "$RUNNER_TEMP/cargo-deny" --strip-components=1 -xz cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny
          "$RUNNER_TEMP/cargo-deny/cargo-deny" check
      - name: Crate package
        run: cargo package --locked

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Unit, PTY and integration tests
        run: cargo test --all-targets --all-features --locked
      - name: Binary smoke
        run: |
          ./target/debug/phig version
          ./target/debug/phig version --json
          ./target/debug/phig completions bash >/dev/null
          ./target/debug/phig manpage >/dev/null
      - name: Performance regression gate
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked
          python3 scripts/benchmark.py --repository "$RUNNER_TEMP/phig-benchmark" --commits 1000 --snapshot-samples 5 --pty-samples 5 --snapshot-p95-ms 1000 --first-frame-p95-ms 1500 --skip-build --json
      - name: Verify macOS deployment floor
        if: runner.os == 'macOS'
        run: |
          otool -l ./target/debug/phig | awk '/LC_BUILD_VERSION/{seen=1;next} seen && /minos/{print; exit}' | grep '12.0'
