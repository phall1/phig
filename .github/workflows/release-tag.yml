# Pushes the vX.Y.Z tag when a release-please PR merges to main. The tag push
# is what triggers cargo-dist's Release workflow (which builds the archives,
# installers, checksums, attestations, and creates the GitHub Release) and the
# crates.io publish workflow. The push uses RELEASE_PLEASE_TOKEN rather than
# GITHUB_TOKEN because tags created with the default token do not trigger
# further workflow runs.
name: release-tag

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  tag:
    if: ${{ github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'release-please--branches--') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Read version from Cargo.toml
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [[ -z "$version" || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not read a semver version from Cargo.toml: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Push release tag
        env:
          GIT_AUTHOR_NAME: phig release bot
          GIT_AUTHOR_EMAIL: phall@users.noreply.github.com
          GIT_COMMITTER_NAME: phig release bot
          GIT_COMMITTER_EMAIL: phall@users.noreply.github.com
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists; nothing to do."
            exit 0
          fi
          git tag -a "${tag}" -m "phig ${{ steps.version.outputs.version }} (tagged by release-tag on merge of the release PR)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: bearer ${RELEASE_PLEASE_TOKEN}" push origin "refs/tags/${tag}"