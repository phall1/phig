[package]
name = "phig-cli"
version = "1.1.0"
edition = "2024"
rust-version = "1.88"
description = "A fast, focused terminal Git history and diff browser"
license = "MIT OR Apache-2.0"
repository = "https://github.com/phall1/phig"
homepage = "https://github.com/phall1/phig"
readme = "README.md"
keywords = ["git", "tui", "terminal", "diff", "tig"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
  ".agents/**",
  ".beads/**",
  ".claude/**",
  ".codex/**",
  ".cursor/**",
  ".github/**",
  "AGENTS.md",
  "CLAUDE.md",
  "deny.toml",
  "dist-workspace.toml",
  "justfile",
  "rustfmt.toml",
]

[[bin]]
name = "phig"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.6.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.9"
clap_mangen = "0.3.3"
command-group = "5.0.1"
crossbeam-channel = "0.5.16"
crossterm = "0.29.0"
memchr = "2.8.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.3.18"
thiserror = "2.0.18"
toml = "1.1.4"
unicode-width = "0.2.2"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.48.0", features = ["json"] }
jsonschema = { version = "0.30.0", default-features = false }
predicates = "3.1.4"
portable-pty = "0.9.0"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dist]
inherits = "release"
lto = "fat"

[package.metadata.dist]
formula = "phig"
