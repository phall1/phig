<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">phig history and diff interface</title>
  <desc id="desc">A focused terminal window with commit history on the left and a syntax-colored patch preview on the right.</desc>
  <rect width="1200" height="720" rx="18" fill="#0b1020"/>
  <rect x="1" y="1" width="1198" height="718" rx="17" fill="none" stroke="#29324a" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="46" rx="17" fill="#171e30"/>
  <rect x="1" y="30" width="1198" height="17" fill="#171e30"/>
  <circle cx="26" cy="24" r="6" fill="#f07178"/><circle cx="47" cy="24" r="6" fill="#ffcb6b"/><circle cx="68" cy="24" r="6" fill="#c3e88d"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
    <text x="94" y="30" fill="#d7deef">phig · example · LOG · main</text>
    <rect x="18" y="61" width="450" height="594" rx="8" fill="#101728"/>
    <rect x="480" y="61" width="702" height="594" rx="8" fill="#0e1423"/>
    <rect x="28" y="78" width="430" height="55" rx="5" fill="#233b4d"/>
    <text x="42" y="101" fill="#80cbc4">●</text><text x="68" y="101" fill="#f4f7ff">5f5eb699</text><text x="184" y="101" fill="#9aa7c2">2m</text>
    <text x="68" y="124" fill="#f4f7ff">add gamma feature</text>
    <text x="42" y="162" fill="#82aaff">●</text><text x="68" y="162" fill="#c9d2e6">a1cc260d</text><text x="184" y="162" fill="#74819c">14m</text>
    <text x="68" y="185" fill="#9aa7c2">refine preview layout</text>
    <text x="42" y="223" fill="#82aaff">●</text><text x="68" y="223" fill="#c9d2e6">0d39c1a4</text><text x="184" y="223" fill="#74819c">1h</text>
    <text x="68" y="246" fill="#9aa7c2">bound async history loading</text>
    <text x="42" y="284" fill="#c792ea">●</text><text x="68" y="284" fill="#c9d2e6">72b612fd</text><text x="184" y="284" fill="#74819c">3h</text>
    <text x="68" y="307" fill="#9aa7c2">render graph lanes</text>
    <text x="42" y="345" fill="#82aaff">●</text><text x="68" y="345" fill="#c9d2e6">21291f6a</text><text x="184" y="345" fill="#74819c">1d</text>
    <text x="68" y="368" fill="#9aa7c2">initial history browser</text>
    <text x="500" y="91" fill="#f4f7ff">5f5eb699be24 · add gamma feature</text>
    <text x="500" y="121" fill="#74819c">Demo User &lt;demo@example.invalid&gt; · 2 minutes ago</text>
    <text x="500" y="157" fill="#c9d2e6">diff --git a/src/app.rs b/src/app.rs</text>
    <text x="500" y="187" fill="#74819c">index fbbee86..85c3040 100644</text>
    <text x="500" y="217" fill="#f07178">--- a/src/app.rs</text>
    <text x="500" y="247" fill="#c3e88d">+++ b/src/app.rs</text>
    <rect x="491" y="265" width="680" height="32" fill="#1b2c3d"/>
    <text x="500" y="288" fill="#89ddff">@@ -1,4 +1,6 @@</text>
    <text x="500" y="326" fill="#c9d2e6"> pub fn open(repository: &amp;Path) {</text>
    <text x="500" y="356" fill="#c9d2e6">     let history = load(repository);</text>
    <text x="500" y="386" fill="#c3e88d">+    let preview = history.selected_diff();</text>
    <text x="500" y="416" fill="#c3e88d">+    render(history, preview);</text>
    <text x="500" y="446" fill="#c9d2e6"> }</text>
    <text x="500" y="496" fill="#ffcb6b">src/app.rs</text><text x="628" y="496" fill="#74819c">+2 −0</text>
    <text x="500" y="536" fill="#9aa7c2">Read-only inspection · Git is the authority</text>
    <rect x="18" y="668" width="1164" height="35" rx="5" fill="#171e30"/>
    <text x="32" y="692" fill="#80cbc4">j/k</text><text x="76" y="692" fill="#9aa7c2">move</text>
    <text x="148" y="692" fill="#80cbc4">Enter</text><text x="214" y="692" fill="#9aa7c2">open</text>
    <text x="280" y="692" fill="#80cbc4">/</text><text x="302" y="692" fill="#9aa7c2">search</text>
    <text x="390" y="692" fill="#80cbc4">Tab</text><text x="434" y="692" fill="#9aa7c2">focus</text>
    <text x="510" y="692" fill="#80cbc4">:</text><text x="532" y="692" fill="#9aa7c2">commands</text>
    <text x="650" y="692" fill="#80cbc4">?</text><text x="672" y="692" fill="#9aa7c2">help</text>
    <text x="1110" y="692" fill="#74819c">1/5</text>
  </g>
</svg>
